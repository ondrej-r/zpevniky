name: Compile and Release Songbooks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-base \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-music \
          make \
          python3

    - name: Run Build Pipeline
      run: |
        make clean
        make

    - name: Generate Unique Version Tag
      id: tag
      run: |
        echo "version=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release and Upload PDFs
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.version }}
        name: Songbooks ${{ steps.tag.outputs.version }}
        files: dist/*.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
