name: Compile and Release Songbooks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-base \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-music \
          make \
          python3 \
          zip

    - name: Run Build Pipeline
      run: |
        make clean
        make

    - name: Generate Unique Version Tag
      id: tag
      run: |
        echo "version=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Package Release Assets
      run: |
        echo "=== Zipping production bundles ==="
        zip -9j songbooks_file.zip dist/*.pdf
        zip -9j songbooks_paper.zip book/*.pdf

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.version }}
        name: Songbooks ${{ steps.tag.outputs.version }}
        files: |
          songbooks_file.zip
          songbooks_paper.zip
          dist/*.pdf
          book/*.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
